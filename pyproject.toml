[project]
name = "formspeak"
version = "0.1.0"
description = "Voice-fillable NYC benefits form — dev tooling environment (the app itself is static + Pages Functions; runnable scripts carry PEP 723 inline metadata)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "ty",
    # Runtime deps of serve.py and the lighter eval runners (which execute in
    # their own PEP 723 script environments) — present here so ty can resolve
    # their imports and actually type-check that code.
    "aiohttp>=3.9",
    "google-genai>=1.0",
    "numpy>=1.26",
]

[tool.ty.src]
# run_livekit.py runs in its own PEP 723 environment with livekit-agents,
# which is too heavy to install just for type resolution.
exclude = ["tests/run_livekit.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["public", "functions"]  # JS lives there; ruff is Python-only

[tool.ruff.format]
# scenarios.py is a data file: one compact dict per conversation turn, written
# to be scanned side-by-side with the eval report. The formatter would explode
# each turn across many lines and bury the script it encodes.
exclude = ["tests/scenarios.py"]

[tool.ruff.lint]
# Match the codebase's existing style: standard rules plus import hygiene.
extend-select = ["I"]
ignore = [
    # Fail-safe by design: telemetry, notifications, and best-effort probes
    # deliberately swallow errors so a logging hiccup can never surface inside
    # someone's voice session (see README "Privacy" / log.js header).
    "S110", "S112", "BLE001",
    # subprocess.run without check=True: every call site inspects returncode
    # itself and surfaces a friendlier error than CalledProcessError would.
    "PLW1510",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
